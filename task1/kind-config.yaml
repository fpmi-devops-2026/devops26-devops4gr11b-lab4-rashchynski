# Конфигурация локального кластера Kubernetes для kind
# Лабораторная работа №4, Задание 1
#
# Топология: 1 control-plane + 2 worker-ноды.
# extraPortMappings пробрасывают порты с нод кластера на хост-машину,
# чтобы сервисы типов NodePort и Ingress были доступны извне.
# Это понадобится в Заданиях 2 и 3.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab4
nodes:
  - role: control-plane
    # Метка ingress-ready позволяет в будущем развернуть ingress-контроллер
    # на этой ноде и принимать трафик через проброшенные порты 80/443.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Диапазон NodePort для доступа к сервисам (Задания 2–3)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
  - role: worker
  - role: worker
