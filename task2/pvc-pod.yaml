# Задание 2. Pod, монтирующий PersistentVolumeClaim demo-pvc в /data.
# Данные в этом томе сохраняются при пересоздании пода.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  namespace: lab4
  labels:
    app: pvc-demo
spec:
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: demo-pvc
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: persistent-data
          mountPath: /data
