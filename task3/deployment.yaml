# Задание 3. Deployment приложения.
# Deployment управляет ReplicaSet и обеспечивает декларативное развёртывание
# и обновление без простоя (RollingUpdate: maxSurge 1, maxUnavailable 0).
# Данные конфигурации приходят из ConfigMap (env + файл) и Secret (env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab4
  labels:
    app: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-config
            items:
              - key: index.html
                path: index.html
